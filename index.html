ord[k].forEach(r=>{const l=inv[r],has=l!==undefined;let cls=has&&!graded?' p':'';if(sel[k].r===r)cls=' s';
if(graded)cls=has&&KEY[k][l]===r?' ok':' no';
const b=mkb(M.R[r],cls,has?l:null);
b.onclick=()=>{if(graded)return;if(has){delete pr[l];sel[k].r=null;rm(k);upd();return}sel[k].r=r;pair();if(sel[k].r!=null)rm(k)};R.append(b)});
c.append(L,R)}

S.forEach(([k,l,n],i)=>{const b=E('button',i?'':'on');b.innerHTML=`${IC[k]} ${l}<small id="b${k}">0/${n}</small>`;b.onclick=()=>{document.querySelectorAll('.tabs button,.pn').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('#p'+k).classList.add('on')};$('#tabs').append(b);

/* Calculations (typed answers) */
const CI=[],PW={mega:6,giga:9,kilo:3,micro:-6,nano:-9,milli:-3,pico:-12,tera:12},PS={T:12,G:9,M:6,k:3,m:-3,'µ':-6,'μ':-6,u:-6,n:-9,p:-12},SUP='⁻⁰¹²³⁴⁵⁶⁷⁸⁹';
function mkcalc(){const p=$('#pcalc');p.innerHTML=ph('🧮','Calculations','Conversions, scientific notation, SI prefixes and word problems — type your answers.');let n=0;
D.calc.forEach((g,gi)=>{const c=E('div','q');c.innerHTML=`<div class="n">${gi+1}</div><p>${g.t}</p>`;
if(g.h){const h=E('p','hint');h.style.fontWeight='400';h.textContent=g.h;c.append(h)}
g.items.forEach(lb=>{const i=n++,r=E('div','cr'),l=E('label'),inp=E('input'),ex=E('div','ex');l.textContent=lb;inp.type='text';inp.autocomplete='off';inp.autocapitalize='off';inp.spellcheck=false;
inp.oninput=()=>{const v=inp.value.trim();if(v)ans.calc[i]=v;else delete ans.calc[i];upd()};
r.append(l,inp,ex);c.append(r);CI.push({inp,ex})});p.append(c)})}
function parse(s){s=s.replace(/[\s,]/g,'').replace(/[−–]/g,'-').replace(/[⁻⁰¹²³⁴⁵⁶⁷⁸⁹]+/g,m=>'^'+m.replace(/./g,c=>SUP.indexOf(c)==0?'-':SUP.indexOf(c)-1));
let a=s.match(/^10\^\(?([+-]?\d+)\)?(.*)$/);if(a)return{mant:1,ex:+a[1],sci:true,rest:a[2]};
a=s.match(/^([+-]?(?:\d+\.?\d*|\.\d+))(?:[x×*]10\^?\(?([+-]?\d+)\)?|e([+-]?\d+))?(.*)$/i);if(!a)return null;
const e=a[2]!==undefined?a[2]:a[3];return{mant:+a[1],ex:e!==undefined?+e:0,sci:e!==undefined,rest:a[4]}}
function check(q,v){const t=q[0],tv=q[1],p=parse(v);if(!p)return false;let val=p.mant*Math.pow(10,p.ex);
if(t=='p'){let pe=null;const w=p.rest.match(/^(mega|giga|kilo|micro|nano|milli|pico|tera)/i);
if(w)pe=PW[w[1].toLowerCase()];else if(p.rest&&PS[p.rest[0]]!==undefined)pe=PS[p.rest[0]];
if(pe===null||val<0.1||val>=1000)return false;val=val*Math.pow(10,pe)}
else if(t=='s'&&(!p.sci||p.mant<1||p.mant>=10))return false;
return Math.abs(val-tv)<=1e-9*Math.abs(tv)}
function pc(){CI.forEach((o,i)=>{const q=KEY.calc[i],v=ans.calc[i],ok=v!==undefined&&check(q,v);o.inp.disabled=true;o.inp.className=ok?'ok':'no';if(!ok)o.ex.textContent='✔ '+q[2]})}
mkcalc();

/* Classification */
const CL=[],SUP2={'⁻':'-','⁰':'0','¹':'1','²':'2','³':'3','⁴':'4','⁵':'5','⁶':'6','⁷':'7','⁸':'8','⁹':'9'};
function nu(s){return s.toLowerCase().replace(/[⁻⁰¹²³⁴⁵⁶⁷⁸⁹]/g,c=>SUP2[c]).replace(/[−–]/g,'-').replace(/[\s·⋅*×.^()]/g,'')}
function mkcls(){const p=$('#pcls'),LT='ABCDEFGHIJKLMNOPQRSTUVWXYZ';p.innerHTML=ph('🧭','Classification','Scalar or vector, basic or derived, and the SI unit of each quantity.');const card=E('div','q ct');card.innerHTML='<div class="n">1</div><p>Classify each of the following physical quantities as scalar or vector, and as basic or derived. Then write its SI unit.</p><p class="hint" style="font-weight:400;margin-left:34px">Tap one option in each pair, then type the SI unit — the name or the symbol is accepted (e.g. kilogram or kg).</p>';p.append(card);
D.cls.forEach((nm,i)=>{const r=E('div','cro'),l=E('div','cn'),ex=E('div','ex'),gs=[];l.innerHTML=`<b>${LT[i]}</b>${nm}`;r.append(l);
[['Scalar','Vector'],['Basic','Derived']].forEach((ops,j)=>{const g=E('div','sg'),bs=ops.map((o,x)=>{const b=E('button');b.textContent=o;b.onclick=()=>{if(graded)return;const k=i*3+j;if(ans.cls[k]===x)delete ans.cls[k];else ans.cls[k]=x;bs.forEach((y,z)=>y.classList.toggle('s',ans.cls[k]===z));upd()};g.append(b);return b});r.append(g);gs.push({g,bs})});
const u=E('input');u.type='text';u.placeholder='SI unit';u.autocomplete='off';u.autocapitalize='off';u.spellcheck=false;
u.oninput=()=>{const v=u.value.trim();if(v)ans.cls[i*3+2]=v;else delete ans.cls[i*3+2];upd()};r.append(u);r.append(ex);card.append(r);CL.push({gs,u,ex})})}
function pcls(cp){CL.forEach((o,i)=>{const q=KEY.cls[i],a=ans.cls,ok=[a[i*3]===q[0],a[i*3+1]===q[1],a[i*3+2]!==undefined&&q[2].includes(nu(a[i*3+2]))];
o.gs.forEach((x,j)=>{x.g.className='sg '+(ok[j]?'ok':'no');x.bs.forEach(b=>b.disabled=true)});o.u.disabled=true;o.u.className=ok[2]?'ok':'no';
if(!ok.every(Boolean))o.ex.textContent='✔ '+['Scalar','Vector'][q[0]]+' · '+['Basic','Derived'][q[1]]+' · '+q[3]});
const sm=E('div','ex');sm.style.fontWeight='600';sm.textContent='Parts correct: '+cp+' / 78  →  '+r2(cp/78)+' / 1';$('#pcls .ct').append(sm)}
mkcls();

/* Password-protected answer key */
function openLock(){$('#err').textContent='';const left=S.reduce((a,[k])=>a+N[k]-Math.min(Object.keys(ans[k]).length,N[k]),0);$('#lock p').textContent=left?left+' part'+(left>1?'s':'')+' still unanswered. Enter the password to check anyway.':'Enter the password to check the answers.';$('#pw').value='';$('#lock').style.display='grid';setTimeout(()=>$('#pw').focus(),50)}
function closeLock(){$('#lock').style.display='none'}
function dec(pw){const raw=atob(BLOB),k=new TextEncoder().encode(pw),u=new Uint8Array(raw.length);
for(let i=0;i<raw.length;i++)u[i]=raw.charCodeAt(i)^k[i%k.length];
const s=new TextDecoder().decode(u);if(s.slice(0,4)!=='G9OK')return null;try{return JSON.parse(s.slice(4))}catch(e){return null}}
function unlock(){const pw=$('#pw').value.trim().toUpperCase();const k=pw?dec(pw):null;
if(!k){$('#err').textContent='Wrong password. Try again.';$('#pw').value='';return}
KEY=k;graded=true;closeLock();$('#ckb').style.display='none';
KEY.tf.forEach((x,i)=>{if(ans.tf[i]===(x[0]?0:1))sc.tf++});KEY.mc.forEach((x,i)=>{if(ans.mc[i]===x)sc.mc++});
['ma','mb'].forEach(m=>KEY[m].forEach((r,i)=>{if(ans[m][i]===r)sc[m]++}));
KEY.calc.forEach((q,i)=>{if(ans.calc[i]!==undefined&&check(q,ans.calc[i]))sc.calc++});
KEY.cls.forEach((q,i)=>{const a=ans.cls;if(a[i*3]===q[0])sc.cls++;if(a[i*3+1]===q[1])sc.cls++;if(a[i*3+2]!==undefined&&q[2].includes(nu(a[i*3+2])))sc.cls++});
const cp=sc.cls;sc.cls=cp/78;
paint('tf');paint('mc');rm('ma');rm('mb');pc();pcls(cp);upd();
const t=sc.tf+sc.mc+sc.ma+sc.mb+sc.calc+sc.cls,p=Math.round(t/TOT*100),r=$('#res');r.style.display='block';
const msg=p>=90?'Outstanding! 🏆':p>=75?'Great job! 🌟':p>=50?'Good effort 👍 Review and try again.':'Keep practicing 📚 You can do it!';
const rows=S.map(([k,l,n])=>`<div><span>${l}</span><i><b style="width:${sc[k]/n*100}%"></b></i><span>${r2(sc[k])}/${n}</span></div>`).join('');
r.innerHTML=`<div class="ring" style="--p:${p}"><span>${p}%</span></div><h2>${r2(t)} / ${TOT}</h2><p>${msg}</p><div class="bk">${rows}</div><button onclick="location.reload()">Try again</button>`;
r.scrollIntoView({behavior:'smooth'})}

/* ===== Extras: ambience, sound, timer, progress, celebration ===== */
const N={tf:20,mc:52,ma:7,mb:5,calc:26,cls:78},RM=matchMedia('(prefers-reduced-motion:reduce)').matches,mmss=t=>Math.floor(t/60)+':'+String(t%60).padStart(2,'0');
let AC=null,snd=false,secs=0;
function tone(f,d=.09,ty='sine',v=.06,at=0){if(!snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+at;o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}}
$('#snd').onclick=()=>{snd=!snd;$('#snd').textContent=snd?'🔊':'🔇';tone(660,.1)};
document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('.o button,.mi,.sg button')){tone(540,.06,'triangle');if(navigator.vibrate)navigator.vibrate(8)}});
let TT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(TT);TT=setTimeout(()=>t.classList.remove('on'),2400)}
const TI=setInterval(()=>{secs++;$('#tm').textContent='⏱ '+mmss(secs)},1000);

(function(){const c=document.createElement('canvas');c.id='bg';document.body.prepend(c);const x=c.getContext('2d');let W,H,P=[];
function rs(){W=c.width=innerWidth;H=c.height=innerHeight;P=Array.from({length:Math.min(42,W/20|0)},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35,r:1.5+Math.random()*2.5}))}
function dr(){x.clearRect(0,0,W,H);const cl=getComputedStyle(document.documentElement).getPropertyValue('--pr').trim()||'#5b4bdb';x.fillStyle=x.strokeStyle=cl;
P.forEach((a,i)=>{a.x=(a.x+a.vx+W)%W;a.y=(a.y+a.vy+H)%H;x.globalAlpha=.3;x.beginPath();x.arc(a.x,a.y,a.r,0,7);x.fill();
for(let j=i+1;j<P.length;j++){const b=P[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<130){x.globalAlpha=.14*(1-d/130);x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}}});
if(!RM)requestAnimationFrame(dr)}
addEventListener('resize',()=>{rs();if(RM)dr()});rs();dr()})();

/* section completion, milestones, next buttons */
const _upd=upd,FIRED={},MT=['🚀 25% done — great start!','⚡ Halfway there!','🔥 75% — final stretch!','🎯 All answered! Ready to check?'];let lastMs=0;
upd=function(){_upd();if(graded)return;let msg='';
S.forEach(([k,l],i)=>{const d=Object.keys(ans[k]).length>=N[k];$('#tabs').children[i].classList.toggle('dn',d);if(d&&!FIRED[k]){FIRED[k]=1;msg='✅ '+l+' complete!';tone(660,.12);tone(880,.16,'sine',.06,.1)}if(!d)FIRED[k]=0});
const pr=parseFloat($('#score').textContent)/TOT,m=[.25,.5,.75,1].filter(v=>pr>=v-1e-6).length;
if(!msg&&m>lastMs)msg=MT[m-1];lastMs=m;if(msg)toast(msg);$('#ckb').classList.toggle('rdy',m===4)};
S.forEach(([k],i)=>{const b=E('button','nx'),n=S[i+1];b.textContent=n?'Next: '+n[1]+' →':'🔒 Check my answers';
b.onclick=()=>{if(n){const t=$('#tabs').children[i+1];t.click();$('#tabs').scrollTo({left:Math.max(0,t.offsetLeft-24),behavior:'smooth'});scrollTo({top:0,behavior:'smooth'})}else if(!graded)openLock()};$('#p'+k).append(b)});

/* celebration after grading */
function confetti(n){if(RM)return;const c=document.createElement('canvas');c.id='cf';document.body.append(c);const x=c.getContext('2d'),W=c.width=innerWidth,H=c.height=innerHeight,cl=['#5b4bdb','#8b5cf6','#06b6d4','#f59e0b','#ef4444','#10b981'];
const P=Array.from({length:n},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*13-3,w:6+Math.random()*6,h:4+Math.random()*5,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cl[Math.random()*cl.length|0]}));let f=0;
(function a(){x.clearRect(0,0,W,H);P.forEach(p=>{p.vy+=.28;p.vx*=.992;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()});
if(++f<200)requestAnimationFrame(a);else c.remove()})()}
function afterGrade(){clearInterval(TI);$('#snd').style.display='';const r=$('#res'),rg=r.querySelector('.ring'),sp=rg.firstElementChild,p=+rg.style.getPropertyValue('--p');
const rk=p>=90?'🧠 Einstein level':p>=75?'🍎 Newton level':p>=60?'⚡ Faraday level':p>=40?'🔭 Galileo in training':'🌱 Curious explorer';
r.querySelector('h2').insertAdjacentHTML('afterend','<div class="rank">'+rk+'</div>');
r.querySelector('p').insertAdjacentHTML('afterend','<p style="margin-top:6px;font-size:13px">⏱ Finished in '+mmss(secs)+'</p>');
const rv=E('button','sec');rv.textContent='🔍 Review mistakes';rv.onclick=()=>{const on=document.body.classList.toggle('rev');rv.textContent=on?'👁 Show all questions':'🔍 Review mistakes';scrollTo({top:0,behavior:'smooth'})};r.append(rv);
if(RM){return}const t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/1300),e=1-Math.pow(1-k,3);rg.style.setProperty('--p',p*e);sp.textContent=Math.round(p*e)+'%';if(k<1)requestAnimationFrame(f)})(t0);
if(p>=60){confetti(p>=90?220:140);[523,659,784,1047].forEach((f,i)=>tone(f,.25,'triangle',.07,i*.14))}else tone(330,.4,'sine',.06)}
const _un=unlock;unlock=function(){const was=graded;_un();if(graded&&!was){clearSave();afterGrade()}};

/* autosave: progress survives refresh / accidental close */
const SK='g9phys-u12-v1';
function clearSave(){try{localStorage.removeItem(SK)}catch(e){}}
function restart(){const n=S.reduce((a,[k])=>a+Object.keys(ans[k]).length,0);if(!graded&&n&&!confirm('Restart and clear all your answers?'))return;clearSave();window.onbeforeunload=null;location.reload()}
(function(){
const save=()=>{if(graded)return;try{localStorage.setItem(SK,JSON.stringify({a:ans,s:secs}))}catch(e){}};
try{const d=JSON.parse(localStorage.getItem(SK)||'null');
if(d&&d.a){S.forEach(([k])=>{const src=d.a[k];if(src&&typeof src==='object')Object.entries(src).forEach(([i,v])=>{if(typeof v==='number'||typeof v==='string')ans[k][i]=v})});
secs=+d.s||0;paint('tf');paint('mc');rm('ma');rm('mb');
Object.entries(ans.calc).forEach(([i,v])=>{if(CI[i])CI[i].inp.value=v});
Object.entries(ans.cls).forEach(([k,v])=>{const i=Math.floor(k/3),j=k%3,o=CL[i];if(!o)return;if(j===2)o.u.value=v;else o.gs[j].bs.forEach((b,z)=>b.classList.toggle('s',v===z))});
upd();toast('Welcome back — your progress was restored')}}catch(e){}
const _u2=upd;upd=function(){_u2();save()};
window.onbeforeunload=e=>{if(!graded&&Object.values(ans).some(o=>Object.keys(o).length)){e.preventDefault();e.returnValue=''}};
addEventListener('pagehide',save);
})();
